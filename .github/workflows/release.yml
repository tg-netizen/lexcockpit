name: Release

# Push a tag like v0.2.0 → build the .app on a macOS runner, ad-hoc sign,
# zip, and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-15 carries Xcode 16 — the toolchain the app is developed
    # against. The first release attempt died on macos-14 in 26s, too
    # fast for a real compile, so the steps below print the toolchain
    # and split build from packaging: whatever fails next names itself.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain in use
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Compile (release configuration)
        run: swift build -c release

      - name: Verify the test batteries
        run: swift run LexCockpit --selftest

      - name: Assemble LexCockpit.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/make-app.sh "$VERSION"

      - name: Notarize (runs only when Apple secrets are configured)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No Apple credentials — shipping ad-hoc signed (right-click → Open)."
            exit 0
          fi
          ditto -c -k --keepParent dist/LexCockpit.app /tmp/notarize.zip
          xcrun notarytool submit /tmp/notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/LexCockpit.app

      - name: Zip the app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent LexCockpit.app "LexCockpit-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LexCockpit-*.zip
          generate_release_notes: true
