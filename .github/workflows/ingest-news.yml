# Optional external cron that triggers the Supabase Edge Function.
#
# Repository secrets:
#   CRON_SECRET             — required. This is the actual gate.
#   SUPABASE_ANON_KEY       — required. Public by design; it ships inside the
#                             Mac app. It only has to satisfy the gateway's
#                             verify_jwt check, which any legacy-signed key does.
#   SUPABASE_URL            — optional, defaults below.
#
# It used to demand SUPABASE_SERVICE_ROLE_KEY, which is the project's master
# credential — it bypasses RLS entirely. The function never needed that: the
# gateway is happy with the anon key and authorized() checks CRON_SECRET. CI had
# been handed full database access to make one authenticated POST. It is still
# accepted if set, so an existing configuration keeps working.
name: Ingest news drafts

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + dedup only (no LLM / drafts)"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest-news Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://fstoenrocfyzdsgmiknj.supabase.co}"
          # Least privilege: prefer the anon key, fall back to service role only
          # if that is what the repository already has configured.
          BEARER="${SUPABASE_ANON_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          if [ -z "$BEARER" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping — set CRON_SECRET and SUPABASE_ANON_KEY in repository secrets."
            exit 0
          fi
          QS=""
          if [ "$DRY_RUN" = "true" ]; then QS="?dry_run=1"; fi
          curl -fsS -X POST \
            "${URL%/}/functions/v1/ingest-news${QS}" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"trigger\":\"github-actions\",\"run\":\"${GITHUB_RUN_ID}\"}"
